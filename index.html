<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotwise</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="library">
      <header class="brand">
        <span class="logo">🗺️</span>
        <div>
          <h1>Spotwise</h1>
          <p>วิทยาลัยอาชีวศึกษาร้อยเอ็ด</p>
        </div>
      </header>

      <div class="search">
        <span>🔍</span>
        <input id="search" type="search" placeholder="ค้นหาไอเท็ม เช่น อาคารเรียน, สนาม" autocomplete="off" />
      </div>

      <nav id="categories"></nav>
      <div id="items"></div>

      <footer class="tips">
        <b>เคล็ดลับ</b>
        <kbd>V</kbd> โหมดเลือก — คลิกอาคารแล้วลากเพื่อย้าย หรือลากมุมเพื่อปรับขนาด ·
        หมวดโรงเรียน: ลากคลุมพื้นที่เพื่อวางอาคารใหม่ · <kbd>X</kbd> ยางลบ
      </footer>
    </aside>

    <main>
      <canvas id="app"></canvas>

      <div id="topbar">
        <button data-act="select" title="เลือก / ย้าย / ปรับขนาด (V)">🖐️<span>เลือก</span></button>
        <span class="divider"></span>
        <button data-act="undo" title="ย้อนกลับ (Ctrl+Z)">↩️<span>ย้อน</span></button>
        <button data-act="redo" title="ทำซ้ำ (Ctrl+Shift+Z)">↪️<span>ทำซ้ำ</span></button>
        <span class="divider"></span>
        <button data-act="erase" title="ยางลบ (X)">🧽<span>ยางลบ</span></button>
        <button data-act="clear" title="ล้างผังทั้งหมด">🗑️<span>ล้าง</span></button>
        <button data-act="reset" title="โหลดผังวิทยาลัยกลับมาใหม่">🏫<span>ผังต้นฉบับ</span></button>
        <span class="divider"></span>
        <button data-act="save-file" title="บันทึกผังเป็นไฟล์ (.json) เก็บไว้เปิดทีหลัง">💾<span>บันทึกผัง</span></button>
        <button data-act="open-file" title="เปิดไฟล์ผังที่บันทึกไว้">📂<span>เปิดผัง</span></button>
        <button data-act="export" title="บันทึกเป็นรูป PNG">📸<span>บันทึกรูป</span></button>
      </div>

      <div id="viewctl">
        <button data-act="view-mode" title="มุมมอง: 3D — กดเพื่อสลับ (P)">🧊</button>
        <button data-act="rot-left" title="หมุนซ้าย (Q)">⟲</button>
        <button data-act="rot-right" title="หมุนขวา (E)">⟳</button>
        <button data-act="zoom-in" title="ซูมเข้า">＋</button>
        <button data-act="zoom-out" title="ซูมออก">－</button>
      </div>

      <div id="selected"></div>
      <div id="hover"></div>

      <div id="inspector">
        <div class="head">
          <span class="no"></span>
          <input class="name" type="text" spellcheck="false" />
          <button data-inspect="delete" title="ลบอาคาร (Delete)">🗑️</button>
        </div>
        <div class="row">
          <button data-inspect="floor-down">−</button>
          <b class="floors"></b>
          <button data-inspect="floor-up">+</button>
          <span class="size"></span>
        </div>
        <p class="note">ลากตัวอาคารเพื่อย้าย · ลากจุดชมพูที่มุมเพื่อปรับกว้าง-ยาว</p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
